<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação de Saúde</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body class="min-h-screen bg-red-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-3xl mx-auto">
        <div class="bg-white rounded-lg shadow-lg p-6 md:p-8">
            <h1 class="text-3xl font-bold text-center mb-8 text-red-800">Avaliação de Saúde</h1>
                        
            <form id="healthForm" action="/relatorio.html" class="space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-red-700 mb-1">Nome completo</label>
                        <input type="text" name="nome" class="w-full p-2 border border-red-300 rounded focus:border-red-500 focus:ring focus:ring-red-200" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-red-700 mb-1">Idade</label>
                        <input type="number" name="idade" class="w-full p-2 border border-red-300 rounded focus:border-red-500 focus:ring focus:ring-red-200" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-red-700 mb-1">Gênero</label>
                        <select name="genero" class="w-full p-2 border border-red-300 rounded focus:border-red-500 focus:ring focus:ring-red-200" required>
                            <option value="">Selecione</option>
                            <option value="masculino">Masculino</option>
                            <option value="feminino">Feminino</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-red-700 mb-1">Etnia/Cor</label>
                        <select name="etnia" class="w-full p-2 border border-red-300 rounded focus:border-red-500 focus:ring focus:ring-red-200" required>
                            <option value="">Selecione</option>
                            <option value="branca">Branca</option>
                            <option value="preta">Preta</option>
                            <option value="parda">Parda</option>
                            <option value="amarela">Amarela</option>
                            <option value="indigena">Indígena</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-red-700 mb-1">Peso (kg)</label>
                        <input type="number" name="peso" class="w-full p-2 border border-red-300 rounded focus:border-red-500 focus:ring focus:ring-red-200" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-red-700 mb-1">Altura (cm)</label>
                        <input type="number" name="altura" class="w-full p-2 border border-red-300 rounded focus:border-red-500 focus:ring focus:ring-red-200" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-red-700 mb-1">Tipo Sanguíneo</label>
                        <select name="tipoSanguineo" class="w-full p-2 border border-red-300 rounded focus:border-red-500 focus:ring focus:ring-red-200" required>
                            <option value="">Selecione</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-red-700 mb-1">Doenças pré-existentes</label>
                        <textarea name="doencasPreExistentes" class="w-full p-2 border border-red-300 rounded focus:border-red-500 focus:ring focus:ring-red-200" rows="3"></textarea>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-red-700 mb-1">Medicamentos em uso</label>
                        <textarea name="medicamentos" class="w-full p-2 border border-red-300 rounded focus:border-red-500 focus:ring focus:ring-red-200" rows="3"></textare
